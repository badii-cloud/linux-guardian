# shellcheck shell=bash
# shellcheck disable=SC2034
# =============================================================================
#  Linux Guardian -- config/guardian.conf
#
#  THE TWO shellcheck LINES ABOVE ARE NOT DECORATION:
#    shell=bash      This file has no #! line (it is never executed directly),
#                    so shellcheck cannot guess its language. This tells it.
#    disable=SC2034  SC2034 is "this variable appears unused". That warning is
#                    correct but irrelevant here: a configuration file does
#                    nothing BUT define variables, and they are used by the
#                    scripts that source it, which shellcheck analyses
#                    separately. Silencing it here -- and only here -- keeps
#                    the linter output clean without hiding real problems in
#                    the scripts.
#
#  This file is NOT executed on its own. Every Bash module reads it with the
#  shell builtin `source` (see linux/system.sh), which means this file is plain
#  Bash: "NAME=value", one per line, no spaces around the "=".
#
#  WHY A SEPARATE CONFIG FILE?
#    Every threshold and every target lives here, in one place. To re-tune the
#    project for a different machine (different VMware gateway, smaller disk,
#    stricter CPU limit) you edit this file only -- you never touch a script.
#    This is exactly how Debian/Kali configure their own services in
#    /etc/default/*, so it is the standard, expected pattern on this OS.
#
#  NOTE ON $GUARDIAN_ROOT
#    Before sourcing this file, each script exports GUARDIAN_ROOT = the absolute
#    path of the linux-guardian/ folder. That lets us build absolute paths here
#    without hard-coding /home/kali/... , so the project still works if it is
#    moved or copied to another user's home directory.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. ALERT THRESHOLDS  (percentages, 0-100)
#
#    Used by Phase 2 (diagnosis.sh) to turn a raw number into PASS / WARNING /
#    FAIL. Phase 1 scripts only MEASURE; they never judge. Kept here now so the
#    file is complete and does not change shape later.
# -----------------------------------------------------------------------------
CPU_WARNING=70          # CPU usage % above this  -> WARNING
CPU_CRITICAL=90         # CPU usage % above this  -> FAIL

RAM_WARNING=75          # RAM usage % above this  -> WARNING
RAM_CRITICAL=90         # RAM usage % above this  -> FAIL

DISK_WARNING=80         # Disk usage % above this -> WARNING
DISK_CRITICAL=90        # Disk usage % above this -> FAIL

# Load average is judged PER CPU CORE, because a load of 4.0 is saturation on a
# 4-core VM but only 50% busy on an 8-core machine. Phase 2 compares
# load_1min / cpu_cores against these two numbers.
LOAD_WARNING_PER_CORE=1.0
LOAD_CRITICAL_PER_CORE=2.0


# -----------------------------------------------------------------------------
# 2. MEASUREMENT TARGETS  (used by Phase 1 -- system.sh)
# -----------------------------------------------------------------------------

# Which filesystem system.sh reports on. "/" is the root filesystem, which on
# this VM is /dev/sda1 and holds everything that matters.
DISK_MOUNT="/"

# Seconds between the two /proc/stat samples used to compute CPU %.
# CPU usage is a RATE, not a value: it can only be measured by comparing two
# readings taken a moment apart. 1 second is the usual compromise -- long enough
# to be meaningful, short enough that the web page still feels instant.
CPU_SAMPLE_INTERVAL=1


# -----------------------------------------------------------------------------
# 3. NETWORK TARGETS  (used by Phase 1 -- network.sh)
# -----------------------------------------------------------------------------

# 192.168.138.2 is the VMware NAT gateway for this VM's 192.168.138.0/24
# network (confirmed with `ip route show default`). It is ALSO the DNS server
# this VM was given by DHCP.
#
# WHY NOT 8.8.8.8?  Because the project must demonstrate correctly OFFLINE. The
# gateway is inside VMware's virtual network, so it answers even when the host
# laptop has no internet at all. Pinging 8.8.8.8 would show a red "DOWN" during
# the demo for a reason that has nothing to do with this Linux VM.
PING_TARGET="192.168.138.2"

# How many ICMP echo requests to send. 2 instead of 1 so a single dropped
# packet does not produce a false "network down" alarm.
PING_COUNT=2

# Seconds to wait for a reply before declaring a packet lost (ping's -W).
# Keeps the web page responsive. ping sends one packet per second, so the worst
# case is  (PING_COUNT - 1) x 1s  +  PING_TIMEOUT  =  1 + 2  =  3 seconds.
# (Measured on this VM against a black-holed address: 3.03 s.)
PING_TIMEOUT=2


# -----------------------------------------------------------------------------
# 4. PROCESS TARGETS  (used by Phase 1 -- process.sh)
# -----------------------------------------------------------------------------

# How many processes the "top consumers" table shows.
TOP_PROCESS_COUNT=10

# Phase 2 uses these to judge the SINGLE busiest process, as a percentage of ONE
# CPU core (the same scale top uses).
#
# WHY THIS CHECK EXISTS SEPARATELY FROM CPU_WARNING: on this 4-core VM, one
# runaway process pinning a whole core shows up as only ~25% overall CPU usage,
# which sails past the machine-wide threshold. Judging the busiest process on
# its own is what catches an infinite loop before it becomes everyone's problem.
PROCESS_CPU_WARNING=70
PROCESS_CPU_CRITICAL=90


# -----------------------------------------------------------------------------
# 5. SERVICE TARGETS  (used by Phase 1 -- services.sh, and Phase 3 -- healing.sh)
# -----------------------------------------------------------------------------

# Services whose status is displayed on the dashboard. One string, space
# separated; services.sh turns it into a real array with `read -r -a` rather
# than relying on unquoted word splitting.
MONITORED_SERVICES="apache2 ssh"

# SAFETY LIST -- Phase 3. healing.sh must REFUSE to touch anything named here,
# even if the web interface asks it to. Restarting ssh or NetworkManager on a
# remote box locks you out; systemd-logind and dbus take the desktop down.
PROTECTED_SERVICES="ssh sshd systemd-logind NetworkManager dbus systemd-journald"

# SAFETY LIST -- Phase 9 guidance. Process names Guardian must never SUGGEST
# stopping, even when one of them is genuinely the busiest thing on the machine.
#
# THIS LIST GUARDS ADVICE, NOT AN ACTION -- and it is needed precisely because
# Guardian cannot kill anything. The incident page prints commands for a human
# to run, and a human will run what the screen tells them to. On a desktop VM
# the busiest process is very often Xorg or the browser, so a page that
# mechanically printed "kill <the busiest pid>" would eventually tell a student
# to destroy their own session in the middle of a demonstration. A suggestion
# that gets followed is an action with extra steps.
#
# Everything here either IS the desktop session, owns it, or is this project.
NEVER_SUGGEST_KILLING="systemd init kthreadd Xorg Xwayland wayland gnome-shell xfwm4 xfdesktop xfce4-session lightdm sddm gdm gdm3 NetworkManager dbus-daemon dbus systemd-logind systemd-journald sshd python3 flask"

# The only service healing.sh is allowed to act on. A deny-list alone is not
# enough: an allow-list means anything we forgot to think about is refused by
# default, which is the safe direction to fail in.
HEALABLE_SERVICES="apache2"

# After asking systemd to start a service, healing.sh must CONFIRM it really
# came up rather than trusting the exit status of `systemctl start`. It re-reads
# the state up to HEAL_VERIFY_ATTEMPTS times, waiting HEAL_VERIFY_DELAY seconds
# between tries.
#
# WHY RETRY AT ALL: `systemctl start` returns as soon as systemd considers the
# unit activated. A service like apache2 can still fail a moment later while
# parsing its own configuration. One immediate check would call that a success.
# Worst case here is 5 x 1 = 5 seconds, which is acceptable for an action the
# user explicitly asked for.
HEAL_VERIFY_ATTEMPTS=5
HEAL_VERIFY_DELAY=1


# -----------------------------------------------------------------------------
# 7. THE DAEMON  (Phase 4 -- guardian-daemon.sh)
# -----------------------------------------------------------------------------

# Seconds between checks. 30 is a compromise: short enough that an outage is
# noticed quickly, long enough that the machine is not spending its life
# querying systemd. Each check costs one `systemctl show` call, which is cheap.
DAEMON_INTERVAL=30

# The single service the daemon watches. It is still passed through healing.sh,
# so PROTECTED_SERVICES and HEALABLE_SERVICES apply to the daemon exactly as
# they do to a human typing the command: changing this line to "ssh" would NOT
# grant the daemon permission to restart ssh, it would just make it log a
# refusal every 30 seconds.
DAEMON_SERVICE="apache2"


# -----------------------------------------------------------------------------
# 6. LOGGING  (used from Phase 3 onwards)
# -----------------------------------------------------------------------------

# ${GUARDIAN_ROOT} is exported by the calling script before this file is
# sourced, so this expands to <project>/logs/guardian.log wherever the project
# folder happens to live.
LOG_FILE="${GUARDIAN_ROOT}/logs/guardian.log"


# -----------------------------------------------------------------------------
# 8. THE COMMAND CONSOLE  (Phase 6 -- actions.json, console.py, workspace.sh)
# -----------------------------------------------------------------------------

# THE SANDBOX. Every file the console is allowed to create lives under this one
# directory and nowhere else. Phase 6 checks membership TWICE -- once in Python
# before the script is called, once in Bash before anything is written -- and
# both checks use `realpath` so that a name which climbs out with ".." is caught
# after the path is resolved, not before.
#
# WHY ${GUARDIAN_ROOT}/workspace AND NOT ~/linux-guardian/workspace:
#   this project is checked out at ~/Desktop/linux-guardian, so a literal
#   ~/linux-guardian would point at a directory that does not exist. Deriving it
#   from GUARDIAN_ROOT keeps the sandbox next to the code that owns it and obeys
#   the same rule as LOG_FILE above -- no absolute /home/kali path is ever
#   written down, so the project survives being moved or copied to another user.
#   Change this ONE line to relocate the sandbox; nothing else needs editing.
WORKSPACE_DIR="${GUARDIAN_ROOT}/workspace"

# Largest file the console may create, in bytes. A web form with no size limit
# is a way to fill the disk, which would trip the very DISK_CRITICAL alarm this
# project exists to report. 64 KiB is far more than a schedule or a note needs.
WORKSPACE_MAX_BYTES=65536

# Where systemd user timers are written by schedule_file.
#
# WHY A *USER* TIMER AND NOT root cron:
#   a user unit needs no sudo at all -- it runs as `kali`, is managed with
#   `systemctl --user`, and can only ever touch files this user could already
#   touch. Adding a root crontab entry would mean the web app could schedule
#   work as root, which is exactly the privilege escalation the whole safety
#   model is built to prevent. It is also consistent: the project already uses
#   systemd for Phase 4, so there is one scheduling mechanism to explain.
SYSTEMD_USER_DIR="${HOME}/.config/systemd/user"

# Prefix for every unit this project generates. Every generated unit is called
# guardian-<name>.timer / guardian-<name>.service, so the units belonging to
# this project can always be listed, and cancelled, without any risk of
# touching a unit a human wrote by hand.
TIMER_PREFIX="guardian-"

# The natural-language matcher must be at least this confident before an action
# is allowed to run. Below it, the console shows the top candidates and asks the
# user to choose -- it never guesses.
#
# IT IS ALSO THE FUZZY LAYER'S ACCEPTANCE SCORE. Deliberately the same number
# and deliberately not a second key: "how sure must the matcher be before this
# runs" is one question, and answering it twice invites the two answers to
# drift apart.
MATCH_MIN_CONFIDENCE=0.75

# How alike two WORDS must be before the fuzzy layer treats them as the same
# word. difflib.SequenceMatcher's ratio, 0.0 to 1.0.
#
# WHY 0.80 AND NOT LOWER: at 0.80 a five-letter word may differ by one letter
# ('disck' vs 'disk' scores 0.89, 'chek' vs 'check' 0.89) but two genuinely
# different short words stay apart ('disk' vs 'disc' is 0.75 and is REFUSED --
# that spelling belongs in the synonym table, where a human decided it, not in
# a similarity score). Dropping to 0.70 would start joining 'log' to 'load' and
# 'ram' to 'run', which is how a matcher becomes confidently wrong.
FUZZY_TOKEN_RATIO=0.80

# How far ahead the winner must be before the fuzzy layer will act on it,
# rather than showing both and asking.
#
# WHY 0.15: fuzzy scores are ratios of weighted trigger words, so the gaps that
# occur in practice are large -- a real winner is usually 0.4 or more ahead.
# Anything under 0.15 means the sentence genuinely did not distinguish the two
# actions, and the honest response is a question, not a guess. This is the same
# instinct as HEALABLE_SERVICES: when unsure, do nothing.
FUZZY_MARGIN=0.15

# Optional local LLM used ONLY to classify text into a known action id. The
# console works fully without it via the deterministic keyword matcher.
OLLAMA_URL="http://127.0.0.1:11434"
OLLAMA_MODEL="llama3.2:1b"
OLLAMA_TIMEOUT=8


# -----------------------------------------------------------------------------
# 9. TIME-SERIES SAMPLING  (Phase 7 -- metrics.sh)
#
# metrics.sh takes ONE cheap reading of every number worth putting on a graph.
# Unlike system.sh it never sleeps and never pings, because it is designed to be
# run over and over on a timer: a sampler that costs four seconds is a sampler
# nobody can afford to run every thirty.
# -----------------------------------------------------------------------------

# Which network interface's byte counters are sampled, and which block device's
# I/O counters are sampled.
#
# BOTH ARE DELIBERATELY EMPTY BY DEFAULT, meaning "work it out at runtime":
#   interface   -> taken from `ip route show default`, the same method
#                  network.sh already uses, so the two modules can never
#                  disagree about which interface is "the" interface.
#   disk device -> taken from `findmnt` on DISK_MOUNT above, so it automatically
#                  follows whichever partition holds the filesystem we already
#                  report on (/dev/sda1 on this VM).
#
# They exist as settings anyway because auto-detection is a guess about intent:
# on a machine with two NICs, or when the interesting disk is not the root one,
# you name it here rather than editing a script. Fill in a bare kernel name --
# "eth0", "sda1" -- not a path.
METRICS_INTERFACE=""
METRICS_DISK_DEVICE=""


# -----------------------------------------------------------------------------
# 10. THE HISTORY DATABASE  (Phase 7 -- guardian_store.py)
#
# Everything before this phase was amnesiac: each reading was measured, judged,
# displayed and thrown away. Nothing here can detect "CPU is high FOR THIS
# MACHINE" without a record of what this machine normally does, so Phase 7 gives
# the project a memory.
# -----------------------------------------------------------------------------

# One SQLite file, next to the code, derived from ${GUARDIAN_ROOT} for the same
# reason LOG_FILE and WORKSPACE_DIR are -- no absolute /home/kali path is ever
# written down, so the project survives being moved or copied.
#
# WHY SQLite AND NOT A FILE OF JSON LINES:
#   "the average CPU over the last hour" is one SELECT against an indexed table.
#   Against a text file it is a full scan of every line ever written, and it
#   gets slower every day the demo machine stays up. SQLite is also already
#   present twice over -- the sqlite3 command is installed on Kali and the
#   sqlite3 MODULE is part of Python's standard library, so this adds no
#   dependency to install and none to explain.
# WHY NOT PostgreSQL/MySQL: they are servers. A server means a daemon to run, a
#   port to expose, a password to manage and a second thing that can be down.
#   This project must demonstrate offline inside one VM, so a database that is
#   just a file the application opens is the correct shape, not a compromise.
HISTORY_DB="${GUARDIAN_ROOT}/data/guardian.db"

# How long a sample is kept. 168 hours = 7 days, which is long enough for
# "normal for a Tuesday morning" to mean something and short enough that the
# file stays small. At one sample every DAEMON_INTERVAL seconds this is roughly
# 600,000 rows and about 40 MB.
HISTORY_RETENTION_HOURS=168

# A HARD BACKSTOP, INDEPENDENT OF THE CLOCK. Retention above is a subtraction
# from the current time, so it fails completely if the clock is wrong -- and on
# a VM that is suspended and resumed the clock IS wrong, sometimes by months. A
# machine that wakes up believing it is 1970 would keep every row for ever and
# fill the disk, which is precisely the failure this project exists to report.
# The row cap cannot be fooled by a clock, so the two guards fail differently.
HISTORY_MAX_ROWS=1000000

# Samples younger than this are what "recent" means when nothing else is said,
# and it is the window the anomaly detector compares against the baseline.
HISTORY_RECENT_SECONDS=300

# Does the daemon collect history as well as heal? 1 = yes, 0 = healing only.
#
# WHY THE DAEMON AND NOT A SECOND systemd TIMER: the daemon is already awake
# every DAEMON_INTERVAL seconds for exactly this purpose. A separate timer would
# mean a second unit to install, a second thing to explain, a second thing that
# can be stopped without anyone noticing -- and two schedules that drift apart,
# so a sample and a health check that appear to describe the same moment would
# not. One wake-up, one moment, one row.
#
# COLLECTION IS SUBORDINATE TO HEALING. If the store breaks, the daemon logs it
# once and carries on watching the service: a broken history must never be able
# to stop the machine healing itself.
DAEMON_COLLECT=1

# How many ticks between retention runs. 120 x 30 s = once an hour. Pruning on
# every tick would be pure waste -- nothing ages out in thirty seconds, and the
# vacuum would run 2,880 times a day to reclaim nothing.
HISTORY_PRUNE_EVERY=120


# -----------------------------------------------------------------------------
# 11. ANOMALY DETECTION  (Phase 7 -- guardian_anomaly.py)
#
# A threshold says "86 is above 70", which is equally true of a build server
# that idles at 80 and a laptop that idles at 3. These settings are what let the
# project ask the better question instead: is this value unusual FOR THIS
# MACHINE, compared with what this machine has actually been doing?
#
# The thresholds in section 1 are NOT replaced. They answer "is this bad?" and
# this section answers "is this abnormal?" -- two different questions, and a
# machine can be one without the other. 95% disk is bad and completely normal
# on a full disk; 40% CPU on a box that idles at 3% is abnormal and harmless.
# -----------------------------------------------------------------------------

# THE TWO WINDOWS, AND WHY THEY MUST NOT OVERLAP.
#   recent    the readings being judged -- "what is happening now"
#   baseline  the readings they are compared against -- "what is usual"
#
# The baseline window ENDS where the recent window BEGINS. If they overlapped,
# the very spike being tested would be sitting inside the average it is measured
# against, dragging that average up towards itself and shrinking the deviation
# it is supposed to reveal. A long enough anomaly would eventually teach the
# detector that it is normal. So: baseline = the hour BEFORE the last 5 minutes.
ANOMALY_RECENT_SECONDS=300
ANOMALY_BASELINE_SECONDS=3600

# How many baseline readings before the detector is willing to have an opinion.
# Below this it reports LEARNING -- not "normal". Saying "normal" when the real
# answer is "I have no idea yet" is the most dangerous thing a monitoring system
# can do, because it is indistinguishable from a clean bill of health.
# 20 samples is 10 minutes at DAEMON_INTERVAL=30.
ANOMALY_MIN_SAMPLES=20

# How many standard deviations from this machine's own average before a reading
# is called abnormal.
#
# WHY 3 AND 4: by Chebyshev's inequality -- which holds for ANY distribution,
# with no assumption that the data is a bell curve -- at most 1/k^2 of readings
# can be k standard deviations from the mean. At k=3 that is at most 11% of the
# time; at k=4, at most 6.25%. Those are the numbers the reported confidence is
# computed from, so the thresholds and the confidence are the same statement.
ANOMALY_Z_WARNING=3.0
ANOMALY_Z_CRITICAL=4.0

# THE NOISE DAMPENER, and the reason the detector is usable at all.
# A metric that has sat at exactly 3.0% for an hour has a standard deviation
# near zero, so a move to 3.4% is mathematically enormous -- a z-score in the
# hundreds -- and completely uninteresting. A reading must therefore ALSO differ
# from the baseline by at least this percentage before it can be called
# abnormal. Both tests must pass: unusual for this machine AND big enough to
# care about.
ANOMALY_MIN_CHANGE_PERCENT=10

# The points a trend is measured over, in seconds, oldest last. These are the
# "1 minute ago / 5 / 15 / 60" comparisons: a value that is high and FALLING is
# a different situation from the same value RISING, and only the second one is
# heading towards an incident.
ANOMALY_TREND_LOOKBACKS="60 300 900 3600"

# Which metrics are scanned. Empty means every metric in the history, which is
# the honest default: a list here is a list of things somebody thought to worry
# about, and the whole point of a baseline is to catch what nobody predicted.
ANOMALY_METRICS=""


# -----------------------------------------------------------------------------
# 12. SEVERITY AND RISK  (Phase 8 -- guardian_risk.py, guardian_incidents.py)
#
# SEVERITY is how serious a thing is in itself. RISK is how much attention it
# deserves right now, given how sure we are, how long it has been going on, and
# what it is happening to. They disagree constantly, and the disagreement is the
# useful part: a CRITICAL seen once at 60% confidence on something nothing
# depends on is not where anybody should look first.
#
# WHAT INCIDENT TYPES EXIST is NOT configured here. That lives in
# linux/incidents.json, for the same reason the action list lives in
# actions.json: it is a registry, an allow-list, and it names ids that must
# exist in actions.json. Config holds numbers you might re-tune; the registry
# holds structure that has to be reviewed.
# -----------------------------------------------------------------------------

# THE SIX RISK WEIGHTS. These are weights, not percentages -- only their RATIO
# matters, because the total is divided by their sum. That means one can be
# changed without re-tuning the other five to keep them adding up to 100.
#
# The defaults say: what it is (severity) matters most; how sure we are and what
# it affects matter next; how long it has run and whether it is a repeat offender
# matter, but less; and a security-relevant type carries the same weight as
# persistence, so a security signal cannot be scored away as background noise.
RISK_WEIGHT_SEVERITY=3.0
RISK_WEIGHT_CONFIDENCE=2.0
RISK_WEIGHT_IMPACT=2.0
RISK_WEIGHT_PERSISTENCE=1.5
RISK_WEIGHT_RECURRENCE=1.0
RISK_WEIGHT_SECURITY=1.5

# The points at which persistence and recurrence stop growing. A problem seen
# 500 times is not fifty times more urgent than one seen 10 times, so both
# factors saturate rather than climbing for ever.
RISK_PERSISTENCE_FULL=10
RISK_RECURRENCE_FULL=5

# What confidence to assume when the detector could not compute one -- the
# zero-variance case in guardian_anomaly, where there is no standard deviation
# to score a deviation against. It sits BELOW SEVERITY_MIN_CONFIDENCE_FOR_HIGH
# on purpose, so a finding whose confidence is unquantifiable can never be
# escalated to HIGH on the strength of a number this project invented for it.
RISK_UNKNOWN_CONFIDENCE=0.5

# How many observations before an incident counts as persistent and its severity
# goes up a step. At DAEMON_INTERVAL=30 this is two and a half minutes: long
# enough that a single wobble does not escalate, short enough that a real
# problem is not still labelled MEDIUM ten minutes in.
SEVERITY_ESCALATE_AFTER=5

# THE CEILING ON A FINDING WE ARE NOT SURE ABOUT. Below this confidence an
# incident cannot be graded HIGH or CRITICAL however alarming the arithmetic
# looks. 0.85 is just under the 88.9% that Chebyshev gives at exactly the
# 3-sigma warning threshold, so a finding that only barely qualifies as an
# anomaly cannot also be the most severe thing on the page.
#
# WHY HAVE A CAP AT ALL: a CRITICAL that turns out to be noise costs more than a
# missed MEDIUM, because it is what teaches people to stop reading the alerts.
SEVERITY_MIN_CONFIDENCE_FOR_HIGH=0.85
